# Redirect Worker for the retired Vulnesis docs hosts. Every request to one of
# these hosts is answered with a 301 to its page on docs.vulnes.is.
#
# worker.js is generated by scripts/build-redirects.mjs from
# migration/redirects/*.tsv. Rebuild, then deploy by hand from this directory:
#
#   node ../scripts/build-redirects.mjs --check ../dist && npx wrangler deploy
#
# A route only takes effect once its host's DNS record is proxied. Each host
# gets a proxied placeholder (AAAA 100::) from vdb-site/terraform/dns.tf
# var.retired_docs_hosts after its old GitHub Pages CNAME is destroyed.
name = "vulnesis-docs-redirects"
main = "worker.js"
compatibility_date = "2026-11-01"
account_id = "e302589106b4c4287aebe65763eb4f80"
workers_dev = false

routes = [
  { pattern = "docs.cli.vulnes.is/*", zone_name = "vulnes.is" },
  { pattern = "docs.guardrails.vulnes.is/*", zone_name = "vulnes.is" },
  { pattern = "docs.mcp.vulnes.is/*", zone_name = "vulnes.is" },
  { pattern = "ai-docs.vulnes.is/*", zone_name = "vulnes.is" },
  { pattern = "docs.code.vulnes.is/*", zone_name = "vulnes.is" },
  # The Pix site's first name. The Worker answers it from the ai-docs map
  # (scripts/lib/redirects.mjs ALIASES), so it is one hop, not two.
  { pattern = "claude-docs.vdb.vulnes.is/*", zone_name = "vulnes.is" },
]
